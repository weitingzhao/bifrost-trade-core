[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bifrost-core"
version = "0.37.0"
description = "Shared library (config/persistence/portfolio/monitor/ib_operator) — Bifrost Trade system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary>=2.9.0",
    "py_vollib>=1.0.1",
    "PyYAML>=6.0",
    "pydantic>=2.0",
    "redis>=4.5.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff==0.16.9",  # one version for CI and every venv; bump on purpose
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocs-mermaid2-plugin>=1.0.0",
    "pymdown-extensions>=10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-v"
markers = [
    "ib: mark test as requiring live IB connection (deselect with '-m not ib')",
    "db: mark test as requiring live PostgreSQL connection",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit rule set. ruff 0.16 widened its default selection from 59 rules to 413,
# so leaving `select` unset made the lint depend on whichever ruff was installed.
# These four groups are the pre-0.16 default; widen them on purpose, not by upgrade.
select = ["E4", "E7", "E9", "F"]
